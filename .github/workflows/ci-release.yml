name: Android CI and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build and test Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Run JVM tests, lint, build debug APK
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Print Android lint diagnostics
        if: failure()
        shell: bash
        run: |
          find app/build -name 'lint-results-debug.txt' -print -exec cat {} \;
      - name: Build signed release APK when signing secrets exist
        id: signed
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo 'Production signing credentials are not configured; a debug APK will be available in Actions artifacts.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/bluetooth-unlock-production.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          gradle --no-daemon :app:assembleRelease
          mkdir -p dist
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cp app/build/outputs/apk/release/app-release.apk "dist/BluetoothUnlock-Android-v${version}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - if: steps.signed.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 30
    outputs:
      signed: ${{ steps.signed.outputs.available }}

  release:
    name: Publish signed Android Release
    needs: verify
    if: needs.verify.outputs.signed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: android-signed-release-files
          path: release-files
      - name: Publish tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Version $tag has already been tagged. Existing releases remain unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Bluetooth Unlock for Android $tag"
          git push origin "refs/tags/$tag"
          gh release create "$tag" release-files/* --verify-tag --title "Bluetooth Unlock for Android $tag" --generate-notes --latest

  preview:
    name: Publish Android preview APK
    needs: verify
    if: needs.verify.outputs.signed != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: preview-files
      - name: Publish preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}-preview.1"
          mkdir -p release-files
          cp preview-files/app-debug.apk "release-files/BluetoothUnlock-Android-${tag}-debug.apk"
          (cd release-files && sha256sum *.apk > SHA256SUMS.txt)
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Preview $tag already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Bluetooth Unlock for Android preview $tag"
          git push origin "refs/tags/$tag"
          gh release create "$tag" release-files/* --verify-tag --prerelease --title "Bluetooth Unlock for Android $tag" --notes '可安装的调试签名预览版，供兼容性测试使用。正式发行版使用固定的签名密钥；切换到正式版时需卸载本预览版。'
